server:
  port: 5000

spring:
  application:
    name: similar-products
  threads:
    virtual:
      enabled: true
  http:
    serviceclient:
      # Existing APIs: /product/{id}/similarids and /product/{id}
      products:
        base-url: http://localhost:3001
        # Timeout of each call, measured by the client from sending the request until the body
        # has been read: it covers the connection, the response and the body. Waiting for a
        # slot of the concurrency limit comes on top.
        read-timeout: 1500ms

similar-products:
  # Time to process a request: the similar ids, the waits for slots and the details. At the
  # deadline, the request answers with the details found so far.
  request-budget: 2s
  catalog-calls:
    # Calls to the existing APIs in progress at the same time. Initial value, to be tuned
    # with measurements.
    max-concurrent: 100
    # How long a call waits for a free slot before it is rejected; 0 rejects it at once.
    permit-timeout: 100ms
  detail-cache:
    # How long a detail stays cached, from the end of its load; reads do not extend it.
    # Unavailable details are not cached, so the next request tries again.
    found-ttl: 30s
    not-found-ttl: 5s
    # Details kept at most
    maximum-size: 10000

management:
  endpoints:
    web:
      exposure:
        # metrics: calls to the existing APIs (http.client.requests), used to measure each change
        include: health,metrics
